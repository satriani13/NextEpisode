<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B10" />
    <meta name="color-scheme" content="dark" />
    <title>%WEB_TITLE%</title>
    <style>
      html, body { height: 100%; margin: 0; background: #06060A; }
      body { overscroll-behavior: none; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; min-height: 100dvh; flex: 1; }
      /* Carruseles de chips sin barra de scroll visible */
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <noscript>NextEpisode necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
